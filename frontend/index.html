<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manager Co-Pilot</title>
    <script>
      // Theme before the first paint: the choice saved by the sidebar switch, else the system
      // appearance. Same rule as src/theme.ts; keep the two in step.
      (function () {
        var choice = null;
        try {
          choice = localStorage.getItem('manager-copilot-theme');
        } catch (e) {}
        var dark =
          choice === 'dark' ||
          (choice !== 'light' && !!window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
