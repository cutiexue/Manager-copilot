name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Backend tests (no model key)
        working-directory: backend
        run: python -m pytest -q
      - name: Validate evaluation definitions
        run: python evaluation/run_evaluation.py --check
      - name: Offline evaluation plumbing (not model scores)
        run: python evaluation/run_evaluation.py --fake --no-ledger --out "${{ runner.temp }}/copilot-evaluation"
      - name: Install frontend from lockfile
        working-directory: frontend
        run: npm ci
      - name: Frontend build and type check
        working-directory: frontend
        run: npm run build
      - name: Frontend response-loss regression tests
        working-directory: frontend
        run: npm test
